name: Beta Release

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  create-beta-release:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      beta_stamp: ${{ steps.meta.outputs.beta_stamp }}
      beta_tag: ${{ steps.meta.outputs.beta_tag }}
      build_version: ${{ steps.meta.outputs.build_version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute beta release metadata
        id: meta
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          BETA_STAMP="$(date -u +%Y%m%d-%H%M%S)"
          BETA_TAG="v${APP_VERSION}-beta-${BETA_STAMP}"
          BUILD_VERSION="${APP_VERSION}_beta-${BETA_STAMP}"

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "beta_stamp=$BETA_STAMP" >> "$GITHUB_OUTPUT"
          echo "beta_tag=$BETA_TAG" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create beta release with generated notes
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const tag = '${{ steps.meta.outputs.beta_tag }}'
            const version = '${{ steps.meta.outputs.app_version }}'
            const stamp = '${{ steps.meta.outputs.beta_stamp }}'
            const notesPath = `RELEASE_NOTES_${version}-beta.md`
            const notes = fs.readFileSync(notesPath, 'utf8')
            const changeSection = notes.match(/### Changes Since[^\n]*\n([\s\S]*?)(?=\n### |$)/)?.[1]?.trim()
            if (!changeSection) throw new Error(`Missing change summary in ${notesPath}`)
            const shortSha = context.sha.slice(0, 7)
            const publishedAt = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC')

            let latestStableTag = null
            let previousBetaTag = null
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              })
              const latestStable = releases.find(release => !release.draft && !release.prerelease && /-stable$/i.test(release.tag_name || ''))
              latestStableTag = latestStable?.tag_name || null
              const priorBeta = releases.find(release =>
                !release.draft &&
                release.prerelease &&
                /^v\d+\.\d+\.\d+-beta-\d{8}-\d{6}$/i.test(release.tag_name || '') &&
                release.tag_name !== tag
              )
              previousBetaTag = priorBeta?.tag_name || null
            } catch (error) {
              core.warning(`Unable to look up prior stable release: ${error.message}`)
            }

            let commits = []
            let compareUrl = null
            let compareBase = previousBetaTag || latestStableTag
            if (compareBase) {
              try {
                const compare = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: compareBase,
                  head: context.sha,
                })
                compareUrl = compare.data.html_url || null
                commits = (compare.data.commits || []).slice(-12)
              } catch (error) {
                core.warning(`Unable to compare commits for beta notes: ${error.message}`)
              }
            }

            const commitLines = commits
              .map(commit => {
                const summary = (commit.commit?.message || '').split('\n')[0].trim()
                return summary ? `- ${summary} (${commit.sha.slice(0, 7)})` : null
              })
              .filter(Boolean)

            const body = [
              `## Android Toolkit v${version}`,
              '',
              'This build includes the latest fixes and improvements from the current branch.',
              '',
              '### Build Info',
              '',
              '- Channel: beta',
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Commit: \`${shortSha}\``,
              `- Built: ${publishedAt}`,
              latestStableTag ? `- Base release: \`${latestStableTag}\`` : null,
              previousBetaTag ? `- Previous build: \`${previousBetaTag}\`` : null,
              compareUrl ? `- Full compare: ${compareUrl}` : null,
              '',
              previousBetaTag ? '### Changes Since the Previous Build' : '### Changes Since the Last Release',
              '',
              changeSection,
              ...(commitLines.length ? ['', 'Recent commits:', ...commitLines] : []),
              '',
              '### Install Notes',
              '',
              '- macOS: open the `.dmg` and drag `Android Toolkit.app` into `Applications`.',
              '- Windows: use the `.exe` installer or `.msi` package.',
              '- Linux: install the native package for your distro when available. Debian-based systems can install the `.deb` with `sudo apt install ./Android-Toolkit_<version>_amd64.deb`.',
              '',
              '### Downloads',
              '',
              `- Latest release: https://github.com/${owner}/${repo}/releases/latest`,
              `- All releases: https://github.com/${owner}/${repo}/releases`,
            ].filter(Boolean).join('\n')

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `v${version} beta-${stamp}`,
              body,
              draft: false,
              prerelease: true,
            })

            core.setOutput('release_id', String(release.data.id))

  publish-tauri:
    needs: create-beta-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Write beta frontend build version
        shell: bash
        run: |
          printf 'VITE_APP_BUILD_VERSION=%s\n' '${{ needs.create-beta-release.outputs.build_version }}' > .env.production.local

      - name: Build and publish beta release artifacts
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_BUILD_VERSION: ${{ needs.create-beta-release.outputs.build_version }}
        with:
          releaseId: ${{ needs.create-beta-release.outputs.release_id }}
          tagName: ${{ needs.create-beta-release.outputs.beta_tag }}
          assetNamePattern: 'Android-Toolkit_${{ needs.create-beta-release.outputs.build_version }}_[arch][_setup][ext]'
          args: ${{ matrix.args }}
